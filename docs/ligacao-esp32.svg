<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Ligacoes do ESP32 DevKit V1 com bateria 2x18650 e divisor 100k/47k</title>
  <desc>Bateria(+) e o resistor 100k vao ao VIN. Bateria(-) e o resistor 47k vao ao GND. O ponto entre os dois resistores vai ao GPIO34.</desc>

  <rect x="6" y="6" width="768" height="458" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="28" y="40" font-size="20" font-weight="700" fill="#0f172a">Ligacoes — ESP32 DevKit V1</text>

  <!-- WIRES -->
  <g stroke="#ef4444" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100,160 V130 H585 V160 H586"/>
    <path d="M400,150 V130"/>
  </g>
  <path d="M400,250 H586" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100,320 V440 H585 V390 H586"/>
    <path d="M400,350 H560 V320 H586"/>
  </g>
  <circle cx="400" cy="130" r="5" fill="#ef4444"/>

  <!-- Bateria -->
  <rect x="40" y="160" width="120" height="160" rx="10" fill="#eff6ff" stroke="#1e293b" stroke-width="2"/>
  <text x="100" y="230" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">2x 18650</text>
  <text x="100" y="252" font-size="13" fill="#475569" text-anchor="middle">serie · 7,4V</text>
  <text x="100" y="151" font-size="17" font-weight="700" fill="#ef4444" text-anchor="middle">+</text>
  <text x="100" y="344" font-size="18" font-weight="700" fill="#64748b" text-anchor="middle">_</text>

  <!-- Resistores (divisor) -->
  <rect x="375" y="150" width="50" height="78" rx="6" fill="#fff7ed" stroke="#1e293b" stroke-width="2"/>
  <text x="400" y="194" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">100k</text>
  <line x1="400" y1="228" x2="400" y2="272" stroke="#1e293b" stroke-width="2"/>
  <circle cx="400" cy="250" r="5" fill="#2563eb"/>
  <rect x="375" y="272" width="50" height="78" rx="6" fill="#fff7ed" stroke="#1e293b" stroke-width="2"/>
  <text x="400" y="316" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">47k</text>

  <!-- ESP32 -->
  <rect x="600" y="105" width="150" height="300" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="675" y="135" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">ESP32</text>
  <text x="675" y="154" font-size="12" fill="#94a3b8" text-anchor="middle">DevKit V1</text>
  <rect x="586" y="154" width="14" height="12" fill="#fca5a5"/><text x="616" y="164" font-size="13" font-weight="700" fill="#fecaca">VIN</text>
  <rect x="586" y="244" width="14" height="12" fill="#93c5fd"/><text x="616" y="254" font-size="13" font-weight="700" fill="#bfdbfe">D34</text>
  <rect x="586" y="314" width="14" height="12" fill="#cbd5e1"/><text x="616" y="324" font-size="13" font-weight="700" fill="#cbd5e1">GND</text>
  <rect x="586" y="384" width="14" height="12" fill="#cbd5e1"/><text x="616" y="394" font-size="13" font-weight="700" fill="#cbd5e1">GND</text>

  <!-- Legenda -->
  <g font-size="12.5">
    <rect x="28" y="426" width="22" height="4" rx="2" fill="#ef4444"/><text x="56" y="434" fill="#0f172a">+ / VIN</text>
    <rect x="150" y="426" width="22" height="4" rx="2" fill="#64748b"/><text x="178" y="434" fill="#0f172a">- / GND</text>
    <rect x="268" y="426" width="22" height="4" rx="2" fill="#2563eb"/><text x="296" y="434" fill="#0f172a">sinal -&gt; GPIO34</text>
  </g>
</svg>
